services:
  mongo:
    image: mongo:7
    container_name: bigdata-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin}
    volumes:
      - mongo-data:/data/db
    networks:
      - bigdata-net

  mongo-express:
    image: mongo-express:1
    container_name: bigdata-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD:-admin}
      - ME_CONFIG_MONGODB_URL=mongodb://admin:${MONGO_PASSWORD:-admin}@mongo:27017/
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - mongo
    networks:
      - bigdata-net

  influxdb:
    image: influxdb:3-core
    container_name: bigdata-influxdb
    command: >
      influxdb3 serve
      --node-id nodo0
      --object-store file
      --data-dir /var/lib/influxdb3
      --without-auth
    ports:
      - "8181:8181"
    volumes:
      - influxdb-data:/var/lib/influxdb3
    networks:
      - bigdata-net

volumes:
  mongo-data:
  influxdb-data:

networks:
  bigdata-net:
    driver: bridge